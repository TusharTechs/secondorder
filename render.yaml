services:
  - type: web
    name: secondorder
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SO_LIVE_AGENT_RUNS_PER_HOUR
        value: "10"
      - key: SO_ACL_SECRET
        generateValue: true
      - key: SO_LIVE_LLM_CALLS_PER_HOUR
        value: "60"
